<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="[https://cdn-icons-png.flaticon.com/512/3244/3244125.png](https://cdn-icons-png.flaticon.com/512/3244/3244125.png)">

    <title>Scan&Go Pro</title>
    
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <style>
        @import url('[https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap)');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-top: env(safe-area-inset-top);
        }
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            height: 90px; 
            background: #111827; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 50; 
            padding-bottom: env(safe-area-inset-bottom);
        }
        .view-container { display: none; padding-bottom: 120px; }
        .view-container.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .product-card { transition: all 0.2s; }
        .product-card.selected { border: 2px solid #3b82f6; background-color: #eff6ff; transform: scale(1.02); }
        .toast { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 200; opacity: 0; transition: all 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; top: 60px; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="toast" class="toast bg-gray-900/90 backdrop-blur text-white px-6 py-3 rounded-2xl shadow-2xl text-sm font-semibold border border-white/10">Mensaje</div>
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 p-4 shadow-sm border-b border-gray-100">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-blue-600 tracking-tighter">Scan&Go</h1>
                <p id="view-title" class="text-[10px] text-gray-400 uppercase font-extrabold tracking-[0.2em]">Almacén</p>
            </div>
            <div class="flex gap-2 bg-gray-50 p-1 rounded-2xl border">
                <button onclick="switchView('inventario')" id="btn-inventario" class="p-2.5 rounded-xl transition-all active:scale-90 bg-blue-600 text-white">📦</button>
                <button onclick="switchView('clientes')" id="btn-clientes" class="p-2.5 rounded-xl transition-all active:scale-90 bg-gray-100 text-gray-500">👥</button>
                <button onclick="switchView('publico')" id="btn-publico" class="p-2.5 rounded-xl transition-all active:scale-90 bg-gray-100 text-gray-500">🛒</button>
            </div>
        </div>
    </header>
    <div id="view-inventario" class="view-container active">
        <div class="p-4 grid grid-cols-2 gap-3">
            <div class="bg-white p-5 rounded-[2rem] border border-gray-100 shadow-sm">
                <p class="text-[10px] text-gray-400 font-bold uppercase mb-1">Stock Total</p>
                <p id="total-val" class="text-3xl font-black text-gray-800">0</p>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-gray-100 shadow-sm">
                <p class="text-[10px] text-gray-400 font-bold uppercase mb-1">Agotándose</p>
                <p id="alert-val" class="text-3xl font-black text-red-500">0</p>
            </div>
        </div>
        <main id="list-inv" class="p-4 space-y-3"></main>
    </div>
    <div id="view-clientes" class="view-container"><div class="p-4"><div id="list-cli" class="space-y-4"></div></div></div>
    <nav id="nav-inv" class="bottom-nav">
        <div class="flex gap-4 items-center px-6 w-full max-w-lg">
            <button onclick="adjust(-1)" class="bg-white/10 text-white w-16 h-16 rounded-3xl font-bold text-3xl border border-white/10">-</button>
            <button onclick="mockScan()" class="flex-1 bg-blue-600 text-white h-16 rounded-3xl font-black shadow-lg text-sm uppercase tracking-[0.2em]">Escanear</button>
            <button onclick="adjust(1)" class="bg-white/10 text-white w-16 h-16 rounded-3xl font-bold text-3xl border border-white/10">+</button>
        </div>
    </nav>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }
        const state = {
            items: JSON.parse(localStorage.getItem('sg_items')) || [
                { id: "1", name: "Papel A4 Premium", price: 5.50, stock: 120, img: "📄" },
                { id: "2", name: "Tóner Negro XL", price: 89.00, stock: 5, img: "🖨️" }
            ],
            selectedId: null
        };
        function save() { localStorage.setItem('sg_items', JSON.stringify(state.items)); }
        function render() {
            const invList = document.getElementById('list-inv');
            invList.innerHTML = state.items.map(i => `
                <div onclick="state.selectedId='${i.id}';render()" class="product-card bg-white p-5 rounded-[2rem] flex items-center shadow-sm border ${state.selectedId === i.id ? 'border-blue-500 bg-blue-50' : 'border-transparent'}">
                    <div class="w-12 h-12 bg-gray-50 rounded-2xl flex items-center justify-center text-2xl">${i.img}</div>
                    <div class="ml-4 flex-1">
                        <p class="font-bold text-gray-800 text-sm">${i.name}</p>
                        <p class="text-blue-600 font-extrabold text-xs">${i.price.toFixed(2)}€</p>
                    </div>
                    <div class="text-right"><p class="font-black text-2xl ${i.stock < 10 ? 'text-red-500' : 'text-gray-800'}">${i.stock}</p></div>
                </div>
            `).join('');
            document.getElementById('total-val').innerText = state.items.length;
            document.getElementById('alert-val').innerText = state.items.filter(i => i.stock < 10).length;
        }
        function adjust(v) {
            if(!state.selectedId) return toast("Toca un producto");
            const i = state.items.find(x => x.id === state.selectedId);
            if(i.stock + v >= 0) { i.stock += v; save(); render(); }
        }
        function toast(t) {
            const e = document.getElementById('toast');
            e.innerText = t; e.classList.add('show');
            setTimeout(() => e.classList.remove('show'), 2000);
        }
        render();
    </script>
</body>
</html>
